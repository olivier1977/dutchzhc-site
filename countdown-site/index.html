<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <div id="countdown" class="countdown">01:00:00</div>
        <div class="button-group">
            <button id="startBtn" class="btn btn-start">Start Countdown</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop Countdown</button>
            <button id="resetBtn" class="btn btn-reset" disabled>Reset Countdown</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
