<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            min-width: 420px;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #8892b0;
            margin-bottom: 2.5rem;
        }

        .timer-display {
            font-size: 7rem;
            font-weight: 200;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.05em;
            color: #64ffda;
            text-shadow: 0 0 40px rgba(100, 255, 218, 0.3);
            margin-bottom: 3rem;
            padding: 1.5rem 0;
            user-select: all;
        }

        .timer-display.flashing {
            animation: flash 0.5s ease-in-out infinite;
        }

        @keyframes flash {
            0%, 100% { color: #64ffda; text-shadow: 0 0 40px rgba(100, 255, 218, 0.3); }
            50% { color: #ff6b6b; text-shadow: 0 0 60px rgba(255, 107, 107, 0.6); }
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 500;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-start {
            background: linear-gradient(135deg, #64ffda 0%, #00bfa5 100%);
            color: #0f0f1a;
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(100, 255, 218, 0.3);
        }
        .btn-start:active { transform: translateY(0); }

        .btn-stop {
            background: linear-gradient(135deg, #ffab40 0%, #ff6d00 100%);
            color: #0f0f1a;
        }
        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 171, 64, 0.3);
        }
        .btn-stop:active { transform: translateY(0); }

        .btn-reset {
            background: rgba(255, 255, 255, 0.08);
            color: #8892b0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-reset:active { transform: translateY(0); }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .status {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #5a6580;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Countdown Timer</h1>
        <div class="timer-display" id="display">01:00:00</div>
        <div class="btn-group">
            <button class="btn-start" id="btn-start">Start</button>
            <button class="btn-stop" id="btn-stop" disabled>Stop</button>
            <button class="btn-reset" id="btn-reset">Reset</button>
        </div>
        <div class="status" id="status">Ready to count down</div>
    </div>

    <script>
        let countdownInterval = null;
        let remainingMs = 3600000; // 1 hour in milliseconds
        let running = false;
        let finished = false;

        const display = document.getElementById('display');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        const status = document.getElementById('status');

        function formatTime(ms) {
            const totalSec = Math.ceil(ms / 1000);
            const h = Math.floor(totalSec / 3600);
            const m = Math.floor((totalSec % 3600) / 60);
            const s = totalSec % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(remainingMs);
        }

        function startCountdown() {
            if (running || remainingMs <= 0) return;
            running = true;
            finished = false;
            display.classList.remove('flashing');
            btnStart.disabled = true;
            btnStop.disabled = false;
            btnReset.disabled = true;
            status.textContent = 'Counting down...';

            const interval = Math.min(remainingMs, 1000);
            const tickMs = 100; // update every 100ms for smooth display

            countdownInterval = setInterval(() => {
                remainingMs -= tickMs;
                if (remainingMs <= 0) {
                    remainingMs = 0;
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    running = false;
                    finished = true;
                    display.classList.add('flashing');
                    status.textContent = 'Time is up!';
                    btnStart.disabled = true;
                    btnStop.disabled = true;
                    btnReset.disabled = false;
                    updateDisplay();
                    return;
                }
                updateDisplay();
            }, tickMs);
        }

        function stopCountdown() {
            if (!running || !countdownInterval) return;
            running = false;
            clearInterval(countdownInterval);
            countdownInterval = null;
            status.textContent = 'Countdown paused';
            btnStart.disabled = false;
            btnStop.disabled = true;
            btnReset.disabled = true;
        }

        function resetCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            running = false;
            finished = false;
            remainingMs = 3600000;
            display.textContent = '01:00:00';
            display.classList.remove('flashing');
            status.textContent = 'Ready to count down';
            btnStart.disabled = false;
            btnStop.disabled = true;
            btnReset.disabled = true;
        }

        btnStart.addEventListener('click', startCountdown);
        btnStop.addEventListener('click', stopCountdown);
        btnReset.addEventListener('click', resetCountdown);
    </script>
</body>
</html>
